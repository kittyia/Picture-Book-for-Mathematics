<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数学图解书</title>
<style>
:root{--ink:#22211f;--muted:#736d65;--paper:#fffdf8;--line:#ddd6ca;--red:#d85d4b;--blue:#397ea3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e9e5de;color:var(--ink);font-family:"Noto Sans SC","Source Han Sans SC","Microsoft YaHei",system-ui,sans-serif}
main{width:min(920px,calc(100% - 28px));padding:76px 82px 82px;background:var(--paper);border:1px solid var(--line);box-shadow:0 14px 40px #4f473c1c}
.mark{width:74px;height:6px;background:var(--red);margin-bottom:30px}
small{letter-spacing:.14em;color:var(--red);font-weight:700}
h1{margin:14px 0 18px;font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",serif;font-size:clamp(42px,7vw,72px);line-height:1.08}
.intro{max-width:36em;color:var(--muted);font-size:17px;line-height:1.75}
.books{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:54px}
a{display:block;min-height:210px;padding:30px;color:inherit;text-decoration:none;border:1px solid var(--line);background:#faf7f0;transition:.18s ease}
a:hover{transform:translateY(-3px);border-color:var(--blue);box-shadow:0 10px 24px #397ea315}
.num{font:15px Georgia,serif;color:var(--red)}
h2{margin:38px 0 9px;font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",serif;font-size:27px}
a p{margin:0;color:var(--muted);line-height:1.65}
@media(max-width:680px){main{padding:52px 26px}.books{grid-template-columns:1fr;margin-top:38px}a{min-height:170px}}
</style>
</head>
<body>
<main>
<div class="mark"></div>
<small>PICTURE BOOK FOR MATHEMATICS</small>
<h1>数学图解书</h1>
<p class="intro">先用图像建立直觉，再用定义把直觉说清楚。选择一本开始阅读。</p>
<div class="books">
<a href="calculus.html"><span class="num">01</span><h2>图解微积分</h2><p>函数、极限、导数与积分</p></a>
<a href="calculus-practice.html"><span class="num">02</span><h2>微积分练习册</h2><p>按知识点整理，答案逐步展开</p></a>
</div>
</main>
</body>
</html>
